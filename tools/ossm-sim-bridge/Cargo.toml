[package]
name = "ossm-sim-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded stdio adapter for the local OSSM-RS simulation core"
license = "Apache-2.0"

[package.metadata.ossm-source]
path = "../../../ossm-rs/ossm-motion"
commit = "578161b2e78d8ca70f8909f0ec34b8ae6014cfda"
license = "Apache-2.0"
profile-id = "ossm-rs-sim-v1"

[dependencies]
ossm-motion = { path = "../../../ossm-rs/ossm-motion" }
embassy-time = { version = "=0.5.0", features = ["std", "generic-queue-32"] }
log = "=0.4.29"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.49.0", features = ["rt"] }
