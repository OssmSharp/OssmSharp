name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag, or empty for validation only.
        required: false
        default: ""
        type: string
      windows_only:
        description: Run only the Windows target during validation.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.windows_only && '["win-x64"]' || '["win-x64","osx-arm64"]') }}
    runs-on: ${{ matrix.runtime == 'win-x64' && 'windows-2025' || 'xcode-27' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
          workloads: ${{ runner.os == 'macOS' && 'macos' || '' }}
      - name: Select Xcode 27
        if: runner.os == 'macOS'
        run: |
          $env:DEVELOPER_DIR = '/Applications/Xcode_27.0.app/Contents/Developer'
          "DEVELOPER_DIR=$env:DEVELOPER_DIR" >> $env:GITHUB_ENV
          xcodebuild -version
          if ($LASTEXITCODE -ne 0) { throw 'Xcode 27 is unavailable.' }
      - name: Set up existing PowerShell test dependency
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -EQ '6.1.0')) {
            Install-Module Pester -RequiredVersion 6.1.0 -Repository PSGallery -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion 6.1.0
      - name: Build, test, and check extracted downloads
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./.github/scripts/Build-Release.ps1 -Tag $env:RELEASE_TAG
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.runtime }}
          path: .artifacts/release/${{ matrix.runtime }}/results/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain validated release outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads-${{ matrix.runtime }}
          path: .artifacts/release/${{ matrix.runtime }}/downloads/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
